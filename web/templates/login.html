<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In &bull; SAGE Operations</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --danger-border: #fca5a5;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-logo {
      height: 52px;
      width: auto;
      margin-bottom: 12px;
      object-fit: contain;
      background: #0f172a;
      border-radius: 10px;
      padding: 6px;
    }

    .brand-title {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--accent);
      text-transform: uppercase;
      line-height: 1.2;
    }

    .brand-subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
      font-weight: 500;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 28px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    .error-banner {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger);
      font-size: 0.84rem;
      font-weight: 600;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      color: var(--text);
      transition: all 0.15s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.15s ease;
    }

    .submit-btn:hover {
      background: var(--accent-hover);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="brand-header">
      <img src="/static/img/sage_logo.png" alt="SAGE" class="brand-logo">
      <div class="brand-title">SAGE</div>
      <div class="brand-subtitle">Strategic Analytics for Guided Execution</div>
    </div>

    <div class="login-card">
      {% if error %}
      <div class="error-banner">
        {{ error }}
      </div>
      {% endif %}

      <form action="/login" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="next" value="{{ next|default('/') }}">

        <div class="form-group">
          <label for="username_or_email">Username or email</label>
          <input type="text" id="username_or_email" name="username_or_email" value="{{ username_or_email|default('') }}" placeholder="admin or name@company.com" required autofocus autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="submit-btn">Sign In to SAGE</button>
      </form>
    </div>
  </div>
</body>
</html>
