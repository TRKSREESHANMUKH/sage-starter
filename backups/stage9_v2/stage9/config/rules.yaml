# stage9/config/rules.yaml
# SAGE Fixed Business & Severity Rules (Pre-registered, No post-hoc tuning)

# 1. Material Inventory Rules
materials:
  safety_stock:
    101: 50.0   # Steel (kg)
    102: 40.0   # Plastic (kg)
    103: 30.0   # Copper (kg)
  reorder_point:
    101: 150.0
    102: 120.0
    103: 100.0
  standard_lead_time_days:
    101: 5
    102: 4
    103: 6

# 2. Finished Goods Inventory Rules
products:
  safety_stock:
    201: 15.0   # Standard Motor (units)
    202: 10.0   # Heavy Duty Motor (units)
  reorder_point:
    201: 30.0
    202: 25.0
  capacity_daily_nominal:
    201: 30.0
    202: 20.0

# 3. Operational Horizon & Risk Windows
planning:
  order_at_risk_horizon_days: 3     # 1-3 business days projection
  critical_days_of_cover: 3.0       # <= 3 days is critical
  warning_days_of_cover: 7.0        # <= 7 days is warning

# 4. Severity Scoring Formulas (Printed in documentation & headers)
# - Material Critical: stock <= safety_stock
# - Material Warning: (stock <= reorder_point AND open_pos == 0) OR (days_of_cover <= 7.0)
# - Product Critical: fg_stock <= 0 OR due_backlog > 0
# - Product Warning: fg_stock <= safety_stock OR shortfall > 0
# - PO Overdue: days_overdue > 0 (Critical if days_overdue >= 3, Warning if days_overdue < 3)
severity_weights:
  due_backlog_per_unit: 10.0
  order_overdue_per_day: 5.0
  material_stockout: 25.0
  production_shortfall_per_unit: 2.0
  po_overdue_per_day: 4.0
