<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAGE Controller — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f8fafc; --surface: #ffffff; --border: #e2e8f0;
      --text: #1e293b; --muted: #64748b; --accent: #2563eb;
      --danger: #dc2626; --radius: 10px;
    }
    body { background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 40px 36px; width: 100%; max-width: 400px; box-shadow: 0 4px 24px rgba(0,0,0,0.07); }
    .logo { font-size: 1.5rem; font-weight: 800; color: var(--accent); margin-bottom: 4px; letter-spacing: -0.03em; }
    .subtitle { font-size: 0.85rem; color: var(--muted); margin-bottom: 28px; }
    label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--muted);
            text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    input[type=password] { width: 100%; padding: 10px 14px; border: 1px solid var(--border);
                           border-radius: 8px; font-size: 1rem; color: var(--text); outline: none; }
    input[type=password]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
    .btn { width: 100%; padding: 11px; background: var(--accent); color: #fff; font-size: 0.95rem;
           font-weight: 700; border: none; border-radius: 8px; cursor: pointer; margin-top: 16px; }
    .btn:hover { background: #1d4ed8; }
    .error { background: #fef2f2; border: 1px solid #fecaca; color: var(--danger);
             border-radius: 8px; padding: 10px 14px; font-size: 0.88rem; margin-bottom: 16px; }
    .framing { font-size: 0.75rem; color: var(--muted); margin-top: 24px;
               padding-top: 16px; border-top: 1px solid var(--border); font-style: italic; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">SAGE Controller</div>
  <div class="subtitle">Operator access — Stage 9 v6</div>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="post" action="/ctrl/login">
    <label for="token">Controller Token</label>
    <input type="password" id="token" name="token" placeholder="Enter controller token" autofocus required>
    <button class="btn" type="submit">Sign In →</button>
  </form>
  <p class="framing">{{ framing }}</p>
</div>
</body>
</html>
