# SAGE Stage 10 — Ten-Day Scripted Demo Scenario Configuration (v5 Enriched Protocol)
# Seed: 42 (deterministic)
# Date range: 2026-01-01 to 2026-01-10

framing: "SAGE performs controlled synthetic causal-attribution evaluation under an expert-defined causal model; it does not claim to prove real-world causality."
seed: 42

scenarios:
  - day: 1
    date: "2026-01-01"
    name: "Quiet Start: Rush Order Demand Intake"
    type: "rush_order_intake"
    description: "Routine baseline operations with a customer rush order on Widget Model X (15 units intake); finished goods buffer covers demand, reaching Watch tier with active shipments."
    expected_status: "WATCH"
    parameters:
      demand_mult_x: 1.5
      demand_mult_y: 1.0
      capacity_factor_x: 1.0
      capacity_factor_y: 1.0

  - day: 2
    date: "2026-01-02"
    name: "Widget Model X Demand Spike"
    type: "demand_spike"
    description: "Demand spike on Widget Model X (36 units placed); finished goods buffer covers demand, no shortage; ongoing shipments."
    expected_status: "WATCH"
    parameters:
      demand_mult_x: 2.5
      demand_mult_y: 1.0
      capacity_factor_x: 1.0
      capacity_factor_y: 1.0

  - day: 3
    date: "2026-01-03"
    name: "Supplier 4 Steel Delivery Delayed"
    type: "supplier_delay"
    description: "Steel rod delivery due Jan 2 (Supplier 4, PO #19) does not arrive and slips 1 day overdue; raw stock buffer absorbs deficit; ongoing shipments."
    expected_status: "NEEDS_ATTENTION"
    parameters:
      po_19_received: false
      demand_mult_x: 1.0
      demand_mult_y: 1.0

  - day: 4
    date: "2026-01-04"
    name: "Partial Receipt, Steel Delay & Demand Spike"
    type: "partial_receipt_and_delay"
    description: "Plastic granules delivery (Supplier 3, PO #20) arrives with 60% partial quantity (150 of 250 kg), balance on Jan 8; steel PO #19 is 2 days overdue; rush order intake on Model Y (12 units)."
    expected_status: "NEEDS_ATTENTION"
    parameters:
      po_20_received_qty: 150
      po_20_total_qty: 250
      po_19_received: false
      demand_mult_y: 1.5

  - day: 5
    date: "2026-01-05"
    name: "Production Line Capacity Disruption"
    type: "capacity_bottleneck"
    description: "Line 2 assembly downtime, Widget Model Y output ~50% below planned production (2 units vs 4 planned); SO #237 delayed; demand intake elevated on Model X."
    expected_status: "NEEDS_ATTENTION"
    parameters:
      capacity_factor_y: 0.5
      capacity_factor_x: 1.0
      po_19_received: false

  - day: 6
    date: "2026-01-06"
    name: "Steel at Safety Stock & Line 1 Maintenance Slowdown"
    type: "compound_disruption"
    description: "Steel PO #19 is 4 days overdue, steel reaches safety level (50 kg); Line 1 maintenance slowdown (Model X output 5 of 10 planned)."
    expected_status: "CRITICAL"
    parameters:
      demand_mult_x: 1.0
      po_19_received: false
      capacity_factor_x: 0.5

  - day: 7
    date: "2026-01-07"
    name: "Severe Disruption: Steel Stock-out, Production Halt & Late Shipment"
    type: "severe_stockout"
    description: "Steel rod stock-out (0 kg), Widget Model X production completely halted, genuine late customer shipment of SO #237 delivered late; Copper PO #21 delay absorbed by raw buffer."
    expected_status: "CRITICAL"
    parameters:
      steel_stockout: true
      prod_x_halted: true
      po_19_received: false
      po_21_overdue: true

  - day: 8
    date: "2026-01-08"
    name: "Inbound Recovery & Full Backlog Clearance"
    type: "recovery"
    description: "Steel PO #19 arrives 5 days late in full (400 kg); plastic PO #20 balance arrives (100 kg); Copper PO #21 arrives (200 m); recovery overtime surge clears all carried-over customer backlog."
    expected_status: "NEEDS_ATTENTION"
    parameters:
      po_19_received: true
      po_19_qty: 400
      po_20_balance_qty: 100
      po_21_received: true
      po_21_qty: 200
      prod_recovery: true

  - day: 9
    date: "2026-01-09"
    name: "Operational Recovery: Return to Normal"
    type: "operational_recovery"
    description: "Full operational recovery; previous backlog cleared in full on Day 8; routine baseline demand and on-time shipments; zero alerts; system returns cleanly to Normal."
    expected_status: "NORMAL"
    parameters:
      demand_baseline: true
      prod_normal: true

  - day: 10
    date: "2026-01-10"
    name: "Dual Independent Issues: Assembly Variance & Inbound Partial Delivery"
    type: "dual_unrelated_issues"
    description: "Two unrelated minor issues: Widget Model Y production -20% below plan (20 units vs 25 planned) and plastic reorder PO #22 arrives with 60% partial quantity (90 of 150 kg). Prior backorders cleared."
    expected_status: "NEEDS_ATTENTION"
    parameters:
      capacity_factor_y: 0.8
      po_22_partial_qty: 90
