    description: "Days late beyond committed delivery date for Bharat Steel Works (Steel backup)."
    is_lag: false

  supplier_2_receipt_fill_rate:
    label: "Bharat Steel Fulfillment Rate"
    technical_name: "supplier_2_receipt_fill_rate"
    group: "Suppliers and purchasing"
    description: "Ratio of delivered units to ordered units on purchase orders from Bharat Steel Works."
    is_lag: false

  supplier_3_po_delay_days:
    label: "Global Polymers Delivery Delay"
    technical_name: "supplier_3_po_delay_days"
