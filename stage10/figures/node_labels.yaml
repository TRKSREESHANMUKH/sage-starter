  product_201_actual_production:
    label: "Widget Model X Actual Output"
    technical_name: "product_201_actual_production"
    group: "Production"
    description: "Actual finished units of Widget Model X produced by Line 1 on day t."
    is_lag: false

  product_202_planned_production:
    label: "Widget Model Y Planned Output"
    technical_name: "product_202_planned_production"
    group: "Production"
