    is_lag: false

  supplier_4_po_delay_days:
    label: "EastCoast Components Delivery Delay"
    technical_name: "supplier_4_po_delay_days"
    group: "Suppliers and purchasing"
    description: "Days late beyond committed delivery date for EastCoast Components (Steel & Plastic primary)."
    is_lag: false

  supplier_4_receipt_fill_rate:
    label: "EastCoast Components Fulfillment Rate"
    technical_name: "supplier_4_receipt_fill_rate"
    group: "Suppliers and purchasing"
    description: "Ratio of delivered units to ordered units on purchase orders from EastCoast Components."
    is_lag: false

  supplier_5_po_delay_days:
    label: "Copper & Co Delivery Delay"
    technical_name: "supplier_5_po_delay_days"
    group: "Suppliers and purchasing"
    description: "Days late beyond committed delivery date for Copper & Co (Copper Wire primary)."
