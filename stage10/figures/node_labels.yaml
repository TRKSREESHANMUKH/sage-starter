  # ─────────────────────────────────────────────────────────────
  # Group 3: Material stock
  # ─────────────────────────────────────────────────────────────
  material_101_stock:
    label: "Steel Rod 10mm Physical Inventory"
    technical_name: "material_101_stock"
    group: "Material stock"
    description: "End-of-day available stock level of Steel Rod 10mm in factory raw stores (units)."
    is_lag: false

  material_101_stock_lag1:
    label: "Steel Rod 10mm Prior Closing Stock"
    technical_name: "material_101_stock_lag1"
    group: "Material stock"
    description: "Autoregressive inventory state carried forward from day t-1."
