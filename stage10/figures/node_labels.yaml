# SAGE Causal DAG Node Labels & Group Mappings
# Source of truth: Stage 7 expert causal model (32 nodes, 40 edges)
# Groups:
#   1. Calendar and demand
#   2. Suppliers and purchasing
#   3. Material stock
#   4. Production
#   5. Finished goods and orders
#   6. Delivery and customer outcome

nodes:
  # ─────────────────────────────────────────────────────────────
  # Group 1: Calendar and demand
  # ─────────────────────────────────────────────────────────────
  weekday:
    label: "Day of the Week"
    technical_name: "weekday"
    group: "Calendar and demand"
    description: "Day of the week (Monday through Sunday) capturing weekly order rhythm."
    is_lag: false

  month:
    label: "Calendar Month"
    technical_name: "month"
    group: "Calendar and demand"
    description: "Calendar month (1 through 12) capturing seasonal purchasing cycles and Q4 surges."
    is_lag: false

  product_201_demand_units:
    label: "Widget Model X Customer Demand"
    technical_name: "product_201_demand_units"
    group: "Calendar and demand"
    description: "Daily customer order intake volume for Widget Model X (units ordered)."
    is_lag: false

  product_202_demand_units:
    label: "Widget Model Y Customer Demand"
    technical_name: "product_202_demand_units"
    group: "Calendar and demand"
    description: "Daily customer order intake volume for Widget Model Y (units ordered)."
    is_lag: false

  # ─────────────────────────────────────────────────────────────
  # Group 2: Suppliers and purchasing
  # ─────────────────────────────────────────────────────────────
  supplier_1_po_delay_days:
    label: "Sri Materials Delivery Delay"
    technical_name: "supplier_1_po_delay_days"
    group: "Suppliers and purchasing"
    description: "Days late beyond committed delivery date for Sri Materials (Steel & Copper backup)."
    is_lag: false

  supplier_1_receipt_fill_rate:
    label: "Sri Materials Fulfillment Rate"
    technical_name: "supplier_1_receipt_fill_rate"
    group: "Suppliers and purchasing"
    description: "Ratio of delivered units to ordered units on purchase orders from Sri Materials."
    is_lag: false

  supplier_2_po_delay_days:
    label: "Bharat Steel Delivery Delay"
    technical_name: "supplier_2_po_delay_days"
