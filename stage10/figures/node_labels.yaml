    description: "Days late beyond committed delivery date for Global Polymers Co (Plastic Granules)."
    is_lag: false

  supplier_3_receipt_fill_rate:
    label: "Global Polymers Fulfillment Rate"
    technical_name: "supplier_3_receipt_fill_rate"
    group: "Suppliers and purchasing"
